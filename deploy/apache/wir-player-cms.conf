# Development virtual host for the WirGroup Player CMS.
# Install this file into Laragon's apache2/sites-enabled directory.

Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/Users/Hanifi Setiawan/Documents/Magang/WirGroup/CMS/cms-server/public"

    <Directory "C:/Users/Hanifi Setiawan/Documents/Magang/WirGroup/CMS/cms-server/public">
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog "C:/laragon/bin/apache/httpd-2.4.54-win64-VS16/logs/wir-player-cms-error.log"
    CustomLog "C:/laragon/bin/apache/httpd-2.4.54-win64-VS16/logs/wir-player-cms-access.log" combined
</VirtualHost>
